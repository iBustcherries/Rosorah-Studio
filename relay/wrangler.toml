name = "rosorah-reports"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
REPO = "iBustcherries/Rosorah-Studio-reports"

# Five reports a minute per address.
[[ratelimits]]
name = "PER_ADDRESS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# The GitHub token is a secret, set once with: npx wrangler secret put GITHUB_TOKEN
# (a fine-grained token with Issues: Read and write on Rosorah-Studio-reports only).
