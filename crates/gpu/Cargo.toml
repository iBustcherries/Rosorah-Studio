[package]
license.workspace = true
name = "auroracast-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
auroracast-core = { path = "../core" }
anyhow.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
# Mask pictures for the image-mask filter.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }


# Importing pictures a game shares on the graphics card (the same version wgpu uses).
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[dev-dependencies]
pollster.workspace = true
