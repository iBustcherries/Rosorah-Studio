# GitHub Pages is published by the repository's master /docs branch setting.
# This legacy template is disabled to prevent overwriting the documentation site.
name: Legacy Jekyll Pages (disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use repository Settings > Pages > master /docs.'
